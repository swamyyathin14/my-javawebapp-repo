
name: CI/CD for Java App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      # 3. Build Java application
      - name: Build with Maven
        run: mvn clean install -f MyWebApp/pom.xml

      # 4. Check WAR file
      - name: Verify WAR file
        run: |
          ls -lh MyWebApp/target/
          test -f MyWebApp/target/MyWebApp.war

      # 5. Deploy to Tomcat
      - name: Deploy to Tomcat
        run: |
          curl --fail-with-body -v \
            --user "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            --upload-file MyWebApp/target/MyWebApp.war \
            "http://${{ secrets.TOMCAT_HOST }}/manager/text/deploy?path=/MyWebApp&update=true"
